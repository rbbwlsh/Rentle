# Netlify config. The site is fully static: the corpus build + vite build +
# per-listing prerender all happen in `npm run build`, and everything under
# client/dist (including the images generated into client/public/img by
# tools/images.js) is the deploy.
#
# NOTE: image binaries are gitignored, so a git-connected Netlify build would
# ship a photo-less site. Deploy from the machine that ran the scrape:
#   netlify deploy --prod

[build]
  command = "npm run build"
  publish = "client/dist"

# The API. One function, routed by its own `path` config (/api/*), which
# Netlify matches before any redirect below — so the SPA fallback needs no
# exception for it. esbuild bundles its imports from server/ and client/src/.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback. Real files (the prerendered /p/<id>/index.html share pages,
# /data/*, /img/*) always win over this redirect on Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Images and hashed assets never change at their URL — cache forever.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Corpus data changes on redeploy at a URL that doesn't, so it must be
# revalidated every load — a stale chunk in a browser cache would keep serving
# copy a redeploy was meant to take down. ETags make that a cheap 304.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
